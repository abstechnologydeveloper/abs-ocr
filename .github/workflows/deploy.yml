name: Deploy OCR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: abs-ocr-deploy
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: terraform

    env:
      TF_INPUT: "false"
      TF_VAR_host: ${{ secrets.OCR_HOST }}
      TF_VAR_ssh_user: ${{ secrets.OCR_SSH_USER }}
      TF_VAR_ssh_password: ${{ secrets.OCR_SSH_PASSWORD }}
      TF_VAR_sudo_password: ${{ secrets.OCR_SUDO_PASSWORD || secrets.OCR_SSH_PASSWORD }}
      TF_VAR_domain: ${{ vars.OCR_DOMAIN || 'ocr.abstechconnect.com' }}
      TF_VAR_letsencrypt_email: ${{ vars.LETSENCRYPT_EMAIL || 'admin@abstechconnect.com' }}
      TF_VAR_enable_https: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Verify HTTPS Health
        working-directory: .
        run: curl -fsS "https://${{ vars.OCR_DOMAIN || 'ocr.abstechconnect.com' }}/health"
