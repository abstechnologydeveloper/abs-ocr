[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abs-ocr-service"
version = "0.1.0"
description = "AbS OCR service launcher for OpenDataLoader."
requires-python = ">=3.11"

[project.scripts]
abs-ocr-server = "abs_ocr_service.launcher:main"

